name: Web Studio Repository Operations

on:
  push:
    paths:
      - ".studio/inbox/project-init.json"

permissions:
  contents: write

concurrency:
  group: web-studio-operations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  process-inbox:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22

      - name: Process repository-native inbox
        env:
          STUDIO_GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/workflow-enforcement.mjs process-github-inbox --root . --actor "$STUDIO_GITHUB_ACTOR"
