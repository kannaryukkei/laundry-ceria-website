name: Web Preview CI

on:
  push:
    branches:
      - main
      - feat/stage-4-website-production
      - test/full-workflow-production-shaped-simulation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Install Chromium for browser QA
        run: npx playwright install --with-deps chromium
      - name: Capture pre-refinement visual baseline
        run: npm run qa:capture-baseline
      - name: Capture dependency security audit
        if: always()
        run: |
          mkdir -p artifacts/browser-qa
          npm audit --json > artifacts/browser-qa/npm-audit-full.json || true
          npm audit --omit=dev --json > artifacts/browser-qa/npm-audit-runtime.json || true
      - name: Browser QA and responsive screenshots
        run: npm run qa:browser
      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laundry-ceria-browser-qa-${{ github.sha }}
          path: artifacts/browser-qa/
          if-no-files-found: warn
          retention-days: 14
