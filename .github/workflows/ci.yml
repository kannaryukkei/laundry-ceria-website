name: Website CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-preview:
    runs-on: ubuntu-latest
    env:
      CAPTURE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Install Playwright and Chromium for breakpoint evidence
        run: npx playwright install --with-deps chromium
      - name: Collect dependency reproducibility and advisory evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node --version > artifacts/node-version.txt
          npm --version > artifacts/npm-version.txt
          cp package.json artifacts/package.json
          cp package-lock.json artifacts/package-lock.json
          set +e
          npm ls --all --json > artifacts/npm-dependency-tree.json 2> artifacts/npm-ls.stderr.log
          ls_status=$?
          npm audit --json > artifacts/npm-audit.json 2> artifacts/npm-audit.stderr.log
          audit_status=$?
          set -e
          cat > artifacts/dependency-review-summary.json <<EOF
          {"npm_ls_exit_code": $ls_status, "npm_audit_exit_code": $audit_status}
          EOF
      - name: Capture Hero at 640px and 720px
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/laundry-ceria-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/laundry-ceria-preview.log
            echo "Vite preview did not become ready"
            exit 1
          fi

          npx playwright screenshot --browser chromium --viewport-size "640,1000" --wait-for-timeout 500 http://127.0.0.1:4173/ artifacts/hero-640.png
          npx playwright screenshot --browser chromium --viewport-size "720,1000" --wait-for-timeout 500 http://127.0.0.1:4173/ artifacts/hero-720.png
          for width in 320 360 900 1024 1280; do
            npx playwright screenshot --browser chromium --viewport-size "${width},1000" --full-page --wait-for-timeout 500 http://127.0.0.1:4173/ "artifacts/visual-review-${width}.png"
          done
          if [ -f tests/a11y-001-keyboard.mjs ]; then node tests/a11y-001-keyboard.mjs; else echo "A11Y-001 browser regression is not part of this PR candidate yet; skipping."; fi
          if [ -f tests/a11y-002-full-keyboard.mjs ]; then node tests/a11y-002-full-keyboard.mjs; else echo "A11Y-002 full keyboard regression is not part of this PR candidate yet; skipping."; fi

          captured_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > artifacts/capture-manifest.json <<EOF
          {
            "repository": "$GITHUB_REPOSITORY",
            "ref": "$GITHUB_REF",
            "commit_sha": "$CAPTURE_SHA",
            "workflow_run_id": "$GITHUB_RUN_ID",
            "preview_url": "http://127.0.0.1:4173/",
            "captured_at_utc": "$captured_at",
            "hero_viewports": [640, 720],
            "additional_full_page_viewports": [320, 360, 900, 1024, 1280],
            "purpose": "Exact-head responsive visual review plus dependency reproducibility and advisory evidence; manual inspection required"
          }
          EOF
      - name: Upload breakpoint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laundry-ceria-hero-breakpoint-evidence-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Canonical shared website quality gate
        uses: kannaryukkei/ai-operated-web-studio/.github/actions/shared-website-quality-gate@44d52586a2179a5f91d46049b139c823eaf1afa2
        with:
          working-directory: .
          preview-command: npm run preview -- --host 127.0.0.1 --port 4174
          url: http://127.0.0.1:4174/
          evidence-manifest: .website-quality/evidence-manifest.json
          artifacts-directory: .website-quality-artifacts
