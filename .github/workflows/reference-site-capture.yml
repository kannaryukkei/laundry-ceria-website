name: Reference website capture

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/capture-reference-sites.mjs'
      - '.github/workflows/reference-site-capture.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  capture-public-references:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture public reference pages
        run: node scripts/capture-reference-sites.mjs
      - name: Upload reference screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laundry-ceria-reference-captures-${{ github.run_id }}
          path: artifacts/reference-sites/
          if-no-files-found: warn
          retention-days: 14
